!
! Zebra configuration saved from vty
!
!
hostname ospfd
password zebra
enable password zebra
!
!
!
interface eth0
 ip ospf area 0.0.0.0
!
interface eth1
 ip ospf cost 25
 ip ospf area 0.0.0.0
!
interface eth2
 ip ospf cost 20
 ip ospf area 0.0.0.0
!
interface eth3
 ip ospf cost 30
 ip ospf area 0.0.0.0
!
interface eth4
 ip ospf cost 23
 ip ospf area 0.0.0.0
!
interface lo
!
router ospf
 default-information originate
!
line vty
!
