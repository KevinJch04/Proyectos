!
! Zebra configuration saved from vty
!
!
hostname ospfd
password zebra
enable password zebra
!
!
!
interface eth0
 ip ospf area 0.0.0.0
!
interface eth1
 ip ospf area 0.0.0.0
!
interface eth2
 ip ospf cost 20
 ip ospf area 0.0.0.0
!
interface eth3
 ip ospf cost 21
 ip ospf area 0.0.0.0
!
interface eth4
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
interface eth5
 ip ospf cost 24
 ip ospf area 0.0.0.0
!
interface lo
!
router ospf
!
line vty
!
